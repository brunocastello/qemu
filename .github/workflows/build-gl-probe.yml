name: Mojave guest kit test build
on:
  push:
    branches: [gl-probe]
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, sparse-checkout: contrib }
      - name: Kit
        run: |
          python3 --version
          bash contrib/utm-guest-kit/build-mojave-kit.sh "$PWD/MojaveGuestKit"
          M=$(hdiutil attach -readonly -nobrowse MojaveGuestKit/MojaveSupport.iso | awk -F'\t' '/Volumes/{print $NF}')
          ls -la "$M" "$M/GLFix"; lipo -info "$M/GLFix/"*; hdiutil detach "$M"
      - uses: actions/upload-artifact@v4
        with: { name: MojaveSupport, path: MojaveGuestKit/MojaveSupport.iso }
